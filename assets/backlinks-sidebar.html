<!-- Relocates the backlinks block (emitted as #quarto-backlinks by the
     quarto-graph filter.lua) out of the page body and into the right margin
     sidebar, placed directly under the "On this page" TOC. Progressive
     enhancement: if this never runs, the block stays at the foot of the page. -->
<script>
(function () {
  var MAX_VISIBLE = 8; // longer lists collapse into a dropdown

  function collapse(backlinks) {
    var list = backlinks.querySelector("ul");
    var title = backlinks.querySelector(".quarto-backlinks__title");
    if (!list || !title) return;
    var n = list.children.length;
    if (n <= MAX_VISIBLE) return;
    var details = document.createElement("details");
    details.className = "quarto-backlinks__details";
    var summary = document.createElement("summary");
    summary.className = "quarto-backlinks__title";
    summary.textContent = "Backlinks (" + n + ")";
    details.appendChild(summary);
    details.appendChild(list);
    title.replaceWith(details);
  }

  function place() {
    var backlinks = document.getElementById("quarto-backlinks");
    var sidebar = document.getElementById("quarto-margin-sidebar");
    if (!backlinks || !sidebar) return;
    var toc = document.getElementById("TOC");
    if (toc && toc.parentElement === sidebar) {
      toc.insertAdjacentElement("afterend", backlinks); // under "On this page"
    } else {
      sidebar.appendChild(backlinks);
    }
    backlinks.classList.add("quarto-backlinks--sidebar");
    collapse(backlinks);
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", place);
  } else {
    place();
  }
})();
</script>
