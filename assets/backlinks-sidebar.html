<!-- Relocates the backlinks block (emitted as #quarto-backlinks by the
     quarto-graph filter.lua) out of the page body and into the right margin
     sidebar, placed directly under the "On this page" TOC. Progressive
     enhancement: if this never runs, the block stays at the foot of the page. -->
<script>
(function () {
  function place() {
    var backlinks = document.getElementById("quarto-backlinks");
    var sidebar = document.getElementById("quarto-margin-sidebar");
    if (!backlinks || !sidebar) return;
    var toc = document.getElementById("TOC");
    if (toc && toc.parentElement === sidebar) {
      toc.insertAdjacentElement("afterend", backlinks); // under "On this page"
    } else {
      sidebar.appendChild(backlinks);
    }
    backlinks.classList.add("quarto-backlinks--sidebar");
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", place);
  } else {
    place();
  }
})();
</script>
