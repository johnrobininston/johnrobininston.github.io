<!-- Animated Vanta.js DOTS background (light / dark). Sits behind all page
     content; re-colours when the Quarto theme toggle changes body class. -->
<div id="vanta-bg" aria-hidden="true"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.dots.min.js"></script>
<script>
(function () {
  var COLORS = {
    light: { backgroundColor: 0xfcfcfc, color: 0x7287fd, color2: 0x8c8fa1 },
    dark:  { backgroundColor: 0x26282e, color: 0x7287fd, color2: 0x8caaee }
  };
  // The animation runs on the homepage only; other pages keep the plain page
  // colour.
  var p = location.pathname.replace(/index\.html$/, "");
  var home = p === "/" || p === "";
  document.documentElement.classList.toggle("vanta-home", home);
  var effect = null;
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function mode() {
    return document.body.classList.contains("quarto-dark") ? "dark" : "light";
  }
  function start() {
    if (!home || !window.VANTA || !window.THREE) return;
    if (effect) effect.destroy();
    var c = COLORS[mode()];
    effect = VANTA.DOTS({
      el: "#vanta-bg",
      mouseControls: !reduced,
      touchControls: false,
      gyroControls: false,
      minHeight: 200,
      minWidth: 200,
      scale: 1,
      scaleMobile: 1,
      backgroundColor: c.backgroundColor,
      backgroundAlpha: 0,
      color: c.color,
      color2: c.color2,
      size: 3,
      spacing: 35,
      showLines: false
    });
  }
  document.addEventListener("DOMContentLoaded", function () {
    start();
    new MutationObserver(start).observe(document.body, {
      attributes: true, attributeFilter: ["class"]
    });
  });
})();
</script>
<style>
#vanta-bg {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
}
/* Let the canvas show through; the colour comes from Vanta instead. */
body.quarto-light, body.quarto-dark { background-color: transparent !important; }
html { background-color: #fcfcfc; }
html:has(body.quarto-dark) { background-color: #26282e; }
</style>
