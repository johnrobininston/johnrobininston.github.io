<!-- LaTeX in box titles. The "Theorem 1 (title)." heading of definition /
     theorem / example boxes is drawn by CSS from data-title, which cannot
     hold math. For titles containing $...$ this inserts a real heading
     element (styled in styles.css as .env-head) and has MathJax typeset it.
     Titles without math are untouched. -->
<script>
(function () {
  var NAMES = { definition: "Definition", theorem: "Theorem", example: "Example", intuition: "Intuition" };
  function build() {
    var made = [];
    Object.keys(NAMES).forEach(function (type) {
      document.querySelectorAll("." + type + "[data-title]").forEach(function (box) {
        var title = box.getAttribute("data-title");
        if (title.indexOf("$") === -1 || box.classList.contains("has-math-title")) return;
        box.classList.add("has-math-title");
        var head = document.createElement("div");
        head.className = "env-head";
        var label = document.createElement("span");
        label.className = "env-label";
        var t = document.createElement("span");
        t.className = "env-title";
        // MathJax here only recognises \( \), not single $ delimiters
        t.textContent = title.replace(/\$([^$]+)\$/g, "\\($1\\)");
        head.append(label, t, document.createTextNode(")."));
        box.insertBefore(head, box.firstChild);
        made.push(t);
      });
    });
    if (made.length && window.MathJax && MathJax.startup) {
      MathJax.startup.promise.then(function () { return MathJax.typesetPromise(made); });
    }
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", build);
  } else {
    build();
  }
})();
</script>
