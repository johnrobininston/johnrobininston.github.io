# Applies to every note under brain/
# Re-execute a note only when its source changes, instead of on every render.
freeze: auto

# Give every note a right-margin table of contents. The quarto-graph local
# mini-graph anchors next to the TOC, so this keeps that panel in the
# top-right corner consistently on every brain page. (Per-note front matter
# can still override this.)
toc: true
