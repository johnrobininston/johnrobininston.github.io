<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">

  <!-- background -->
  <rect x="0" y="0" width="800" height="300" fill="#0d1f2e"/>

  <!-- subtle grid lines -->
  <g stroke="#16324a" stroke-width="1">
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="480" y1="0" x2="480" y2="300"/>
    <line x1="560" y1="0" x2="560" y2="300"/>
    <line x1="640" y1="0" x2="640" y2="300"/>
    <line x1="720" y1="0" x2="720" y2="300"/>
  </g>

  <!-- right half: exploration/branching path diagram -->
  <g>
    <!-- start node -->
    <circle cx="470" cy="150" r="8" fill="#c9812f"/>
    <circle cx="470" cy="150" r="14" fill="none" stroke="#c9812f" stroke-width="1.5" opacity="0.4"/>

    <!-- branching dashed paths to exploration options -->
    <path d="M 470 150 C 540 150, 560 70, 640 55" fill="none" stroke="#5a8fb0" stroke-width="2" stroke-dasharray="6 4" opacity="0.7"/>
    <path d="M 470 150 C 540 150, 560 130, 650 130" fill="none" stroke="#5a8fb0" stroke-width="2" stroke-dasharray="6 4" opacity="0.7"/>
    <path d="M 470 150 C 540 150, 560 190, 645 205" fill="none" stroke="#5a8fb0" stroke-width="2" stroke-dasharray="6 4" opacity="0.7"/>
    <path d="M 470 150 C 530 150, 560 245, 630 255" fill="none" stroke="#5a8fb0" stroke-width="2" stroke-dasharray="6 4" opacity="0.5"/>

    <!-- destination nodes (transfer options) -->
    <circle cx="640" cy="55" r="7" fill="#c9812f" opacity="0.9"/>
    <circle cx="650" cy="130" r="7" fill="#c9812f" opacity="0.9"/>
    <circle cx="645" cy="205" r="7" fill="#c9812f" opacity="0.9"/>
    <circle cx="630" cy="255" r="7" fill="#c9812f" opacity="0.85"/>

    <!-- secondary satellite nodes further along each path -->
    <circle cx="710" cy="40" r="4" fill="#7ecfff" opacity="0.8"/>
    <circle cx="725" cy="120" r="4" fill="#7ecfff" opacity="0.8"/>
    <circle cx="715" cy="215" r="4" fill="#7ecfff" opacity="0.8"/>
    <circle cx="695" cy="262" r="4" fill="#7ecfff" opacity="0.7"/>

    <line x1="640" y1="55" x2="710" y2="40" stroke="#7ecfff" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5"/>
    <line x1="650" y1="130" x2="725" y2="120" stroke="#7ecfff" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5"/>
    <line x1="645" y1="205" x2="715" y2="215" stroke="#7ecfff" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5"/>
    <line x1="630" y1="255" x2="695" y2="262" stroke="#7ecfff" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4"/>

    <!-- legend -->
    <rect x="470" y="20" width="12" height="12" rx="6" fill="#c9812f"/>
    <text x="488" y="30" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5a8fb0">pathways</text>
    <circle cx="595" cy="26" r="5" fill="#7ecfff"/>
    <text x="606" y="30" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5a8fb0">outcomes</text>
  </g>

  <!-- left half panel -->
  <rect x="0" y="0" width="420" height="300" fill="#0d1f2e"/>

  <text x="48" y="148"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="92" font-weight="700" letter-spacing="-2"
    fill="#ffffff">PSTAT</text>

  <text x="48" y="232"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="92" font-weight="700" letter-spacing="-2"
    fill="#c9812f">188</text>

  <text x="48" y="256"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="14" font-weight="400" letter-spacing="2.5"
    fill="#5a8fb0">TRANSFER EXPLORATION</text>

  <text x="48" y="274"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="14" font-weight="400" letter-spacing="2.5"
    fill="#5a8fb0">SEMINAR</text>

  <line x1="420" y1="0" x2="420" y2="300" stroke="#1e3d58" stroke-width="1.5"/>

</svg>
