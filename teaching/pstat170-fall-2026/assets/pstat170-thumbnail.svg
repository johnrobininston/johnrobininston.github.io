<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">

  <!-- background -->
  <rect x="0" y="0" width="800" height="300" fill="#0d1f2e"/>

  <!-- subtle grid lines -->
  <g stroke="#16324a" stroke-width="1">
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="480" y1="0" x2="480" y2="300"/>
    <line x1="560" y1="0" x2="560" y2="300"/>
    <line x1="640" y1="0" x2="640" y2="300"/>
    <line x1="720" y1="0" x2="720" y2="300"/>
  </g>

  <!-- right half: simulated asset price paths with strike level -->
  <g>
    <!-- strike level -->
    <line x1="445" y1="130" x2="785" y2="130" stroke="#7ecfff" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.7"/>
    <text x="760" y="122" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5a8fb0">K</text>

    <!-- background paths -->
    <polyline points="450,150 480,158 510,146 540,170 570,160 600,184 630,170 660,196 690,182 720,204 750,190 770,210"
      fill="none" stroke="#5a8fb0" stroke-width="2" opacity="0.55"/>
    <polyline points="450,150 480,144 510,152 540,140 570,156 600,148 630,164 660,150 690,138 720,150 750,142 770,152"
      fill="none" stroke="#5a8fb0" stroke-width="2" opacity="0.55"/>
    <polyline points="450,150 480,162 510,172 540,158 570,176 600,166 630,190 660,178 690,216 720,230 750,222 770,244"
      fill="none" stroke="#5a8fb0" stroke-width="2" opacity="0.55"/>

    <!-- highlighted path -->
    <polyline points="450,150 480,138 510,160 540,120 570,132 600,98 630,112 660,84 690,100 720,76 750,88 770,70"
      fill="none" stroke="#b078e0" stroke-width="3"/>

    <!-- start node -->
    <circle cx="450" cy="150" r="6" fill="#b078e0"/>
    <circle cx="450" cy="150" r="12" fill="none" stroke="#b078e0" stroke-width="1.5" opacity="0.4"/>

    <!-- terminal nodes -->
    <circle cx="770" cy="70" r="5" fill="#b078e0"/>
    <circle cx="770" cy="152" r="4" fill="#5a8fb0"/>
    <circle cx="770" cy="210" r="4" fill="#5a8fb0"/>
    <circle cx="770" cy="244" r="4" fill="#5a8fb0"/>

    <!-- legend -->
    <circle cx="470" cy="26" r="5" fill="#b078e0"/>
    <text x="481" y="30" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5a8fb0">price paths</text>
    <circle cx="595" cy="26" r="5" fill="#7ecfff"/>
    <text x="606" y="30" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5a8fb0">strike</text>
  </g>

  <!-- left half panel -->
  <rect x="0" y="0" width="420" height="300" fill="#0d1f2e"/>

  <text x="48" y="148"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="92" font-weight="700" letter-spacing="-2"
    fill="#ffffff">PSTAT</text>

  <text x="48" y="232"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="92" font-weight="700" letter-spacing="-2"
    fill="#b078e0">170</text>

  <text x="48" y="256"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="14" font-weight="400" letter-spacing="2.5"
    fill="#5a8fb0">INTRODUCTION TO</text>

  <text x="48" y="274"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="14" font-weight="400" letter-spacing="2.5"
    fill="#5a8fb0">MATHEMATICAL FINANCE</text>

  <line x1="420" y1="0" x2="420" y2="300" stroke="#1e3d58" stroke-width="1.5"/>

</svg>
