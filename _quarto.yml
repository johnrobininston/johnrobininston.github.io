project:
  type: website
  output-dir: docs
  pre-render: quarto-graph prerender
  post-render: quarto-graph postrender

filters:
  - quarto-graph

# Graph view over all notes EXCEPT the lecture slides/notes (teaching/).
# Kept in the graph: brain/, posts/, projects/. exclude: is opt-out-only
# (trailing "/" drops a whole subtree; bare names are fnmatch globs, and
# fnmatch "*" also matches "/", so pages are listed by name rather than
# with "*.qmd", which would also catch nested notes).
quarto-graph:
  sidebar:
    enabled: true   # per-page local mini-graph in the top-right (next to the TOC)
    depth: 2        # hops shown around the current note (2 = neighbours + their neighbours)
  exclude:
    - teaching/        # lecture slides and lecture notes
    # site-chrome / listing pages (not notes):
    - about.qmd
    - blog.qmd
    - contact.qmd
    - index.qmd
    - projects.qmd
    - resume.qmd
    - teaching.qmd

website:
  description: "Personal Academic Website"
  site-url: https://johnrobininston.com # you must change this appropriately for RSS feeds to work properly
  title: "John Robin Inston"
  favicon: assets/images/favicon-new.png
  navbar:
    left:
      - text: About
        href: about.qmd
      - blog.qmd
      - projects.qmd
      - teaching.qmd
      - text: Brain
        href: brain.qmd
      - contact.qmd
    right:
      - icon: youtube
        href: https://www.youtube.com/@JohnRobinInston
      - icon: github
        href: https://github.com/johnrobininston
      - icon: linkedin
        href: https://www.linkedin.com/in/johnrobininston/?skipRedirect=true
      - icon: mastodon
        href: https://mastodon.social/@johnrobininston
  page-footer: "Copyright 2026, John Inston."
  back-to-top-navigation: true
resources:
  - assets/images/brain-graph.svg
  - CNAME
  - brain/index.html   # redirect so the bare /brain/ URL lands on brain.html
format:
  html:
    theme:
      light: _extensions/cadojo/catppuccin/latte.scss
      dark: _extensions/cadojo/catppuccin/frappe.scss
    css: styles.css
    link-external-newwindow: true
    # Wider reading column (+~0.5in each side vs the 800px default) and a
    # roomier right margin + gutter so the TOC / graph panel sit out toward
    # the right edge instead of hugging the body text.
    grid:
      body-width: 900px
      margin-width: 300px
      gutter-width: 3rem
