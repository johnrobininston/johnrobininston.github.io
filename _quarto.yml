project:
  type: website
  output-dir: docs
  pre-render: quarto-graph prerender
  post-render: quarto-graph postrender

filters:
  - quarto-graph

# Graph view over all notes EXCEPT the lecture slides/notes (teaching/).
# Kept in the graph: brain/, posts/, projects/. exclude: is opt-out-only
# (trailing "/" drops a whole subtree; bare names are fnmatch globs, and
# fnmatch "*" also matches "/", so pages are listed by name rather than
# with "*.qmd", which would also catch nested notes).
quarto-graph:
  sidebar:
    enabled: true   # per-page local mini-graph in the top-right (next to the TOC)
    depth: 2        # hops shown around the current note (2 = neighbours + their neighbours)
  exclude:
    - teaching/        # lecture slides and lecture notes
    # site-chrome / listing pages (not notes):
    - about.qmd
    - blog.qmd
    - contact.qmd
    - index.qmd
    - projects.qmd
    - resume.qmd
    - teaching.qmd

website:
  description: "Personal Academic Website"
  site-url: https://johnrobininston.com # you must change this appropriately for RSS feeds to work properly
  title: "John Robin Inston"
  favicon: assets/images/favicon-new.png
  sidebar:
    - id: pstat160a-notes
      title: "PSTAT160A Applied Stochastic Processes"
      style: "docked"
      contents:
        - text: "PSTAT160A Notes"
          href: brain/pstat160a-notes/00-introduction/intro.qmd
        - section: "Preliminary Topics"
          contents:
            - brain/pstat160a-notes/generating-functions/generating-functions.qmd
            - brain/pstat160a-notes/markov-chains/markov-chains.qmd
    - id: pstat100-notes
      title: "PSTAT100 Data Science and Analysis"
      style: "docked"
